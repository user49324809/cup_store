<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ананасовый улун — Teaboom</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <article class="product-card">
            <!-- изображение -->
            <img
                src="assets/pineapple-oolong.webp"
                alt="Ананасовый улун Teaboom"
            >
            <!-- информация о товаре -->
            <div class="product-info">
                <!-- категория -->
                <span>Китайский светлый ароматизированный улун</span>
                <!-- h1 Ананасовый улун -->
                <h1>Ананасовый улун</h1>
                <!-- выбор фасовки -->
                <div class="package-options">
                    <button
                        type="button"
                        class="package-option"
                        data-size="100"
                        aria-pressed="true"
                    >
                        100 г
                    </button>
                    <button
                        type="button"
                        class="package-option"
                        data-size="500"
                        aria-pressed="false"
                    >
                        500 г
                    </button>
                    <button
                        type="button"
                        class="package-option"
                        data-size="1000"
                        aria-pressed="false"
                    >
                        1000 г
                    </button>
                    <button
                        type="button"
                        class="package-option"
                        data-size="5000"
                        aria-pressed="false"
                    >
                        5000 г
                    </button>
                </div>
                <!-- артикул -->
                <p>
                    Артикул:
                    <span id="product-article">01306</span>
                </p>
                <!-- старая цена -->
                <!-- актуальная цена -->
                <div class="price-block">
                    <span id="old-price">349,20 ₽</span>
                    <span id="current-price">326,40 ₽</span>
                </div>
                <!-- кнопка В корзину -->
                <button
                    type="button"
                    class="cart-button"
                >
                    В корзину
                </button>
                <!-- короткое описание -->
                <p class="product-description">
                    Ароматизированный улун с мягким фруктовым вкусом и яркими нотами 
                    спелого ананаса.
                </p>
            </div>
        </article>
    </main>
<script src="./js/script.js"></script>
</body>
</html>
